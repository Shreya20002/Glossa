<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Glossa</title>
  <!--
    The source of Glossa's app icon. After editing it, run `pnpm icon` to redraw
    build/icon.png, which electron-builder turns into the Windows and macOS icons.
    Layout follows the macOS icon grid: an 824 x 824 tile with a 100 px margin.
  -->
  <defs>
    <!-- Glossa's accent blue, lighter at the top. -->
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6684f0" />
      <stop offset="1" stop-color="#2f47b5" />
    </linearGradient>
    <!-- The soft shadow macOS icons have under their tile. -->
    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1440" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)" />

  <!-- A speech bubble... -->
  <g fill="#ffffff">
    <rect x="252" y="282" width="520" height="368" rx="128" />
    <path d="M 356 610 C 350 680 326 722 290 752 C 372 748 436 712 476 646 Z" />
  </g>

  <!-- ...with three voice-level bars that show the blue tile through it. -->
  <g fill="url(#tile)">
    <rect x="372" y="402" width="64" height="128" rx="32" />
    <rect x="480" y="358" width="64" height="216" rx="32" />
    <rect x="588" y="390" width="64" height="152" rx="32" />
  </g>
</svg>
