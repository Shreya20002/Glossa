# CI = "continuous integration": GitHub runs these checks on its own computers
# ("runners") for every pull request and every push to main. A red ❌ on a PR
# means something here failed; click "Details" to see which step and why.
# Line-by-line walkthrough: docs/maintainer-guide/04-ci-explained.md

# The name shown in the Actions tab.
name: CI

# WHEN this workflow runs.
on:
  pull_request: # every PR, including PRs from forks
  push:
    branches: [main] # every change that lands on main
  workflow_dispatch: # a "Run workflow" button in the Actions tab, for manual runs

# The GITHUB_TOKEN that jobs receive can only READ the repository. CI never
# needs to write anything, so a compromised step can't do damage.
permissions:
  contents: read

# If you push again to the same PR while CI is still running, cancel the old
# run: only the newest commit matters. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job 1: fast checks on Linux (the cheapest, quickest runner).
  checks:
    name: Checks (format, lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Download the repository's code onto the runner.
      - uses: actions/checkout@v7
        with:
          # Don't leave a GitHub token in .git/config for later steps to find.
          persist-credentials: false

      # Install pnpm. With no version given, it uses "packageManager" from
      # package.json, so CI always matches what developers use.
      # Third-party action: pinned to an exact commit (see 04-ci-explained.md).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Install Node.js (version from .nvmrc) and cache pnpm's download store
      # between runs, so installs are faster.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Install exactly what pnpm-lock.yaml says. If package.json and the
      # lockfile disagree, fail instead of silently changing versions.
      - run: pnpm install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type-check (TypeScript)
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

  # Job 2: build the real app on both platforms Glossa supports, then run it
  # end to end with a fake microphone. This catches problems the checks can't:
  # a broken build config, a model that isn't bundled, an OS-specific bug.
  # It runs at the same time as "checks" to save waiting time.
  # (The job keeps its original name because the main-branch ruleset requires it.)
  build:
    name: Build (${{ matrix.os }})
    # A "matrix" runs this same job once per entry, in parallel.
    strategy:
      # Let both platforms finish even if one fails, so you see every failure at once.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Models only change when scripts/fetch-models.mjs changes, so keep them
      # between runs instead of downloading them every time.
      - name: Cache AI models
        uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch-models.mjs') }}

      # Downloads anything missing from the cache, and verifies every checksum.
      - name: Fetch AI models
        run: pnpm fetch-models

      # Compile and package an unpacked app folder (no installer, no signing).
      - name: Build unpacked app
        run: pnpm build:unpack
        env:
          # No signing certificates in CI yet, so don't go looking for any.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Launch the packaged app exactly as users would, feed it speech through a
      # fake microphone, and check the overlay. See e2e/session.spec.ts.
      - name: End-to-end tests (packaged app)
        run: pnpm exec playwright test
        env:
          GLOSSA_E2E_PACKAGED: '1'
          # Always measure the microphone and save a short report, pass or fail.
          GLOSSA_E2E_DIAGNOSTICS: '1'

      # Show that report as an annotation on the run page. Unlike raw logs,
      # annotations can be read by anyone, including outside contributors.
      - name: Publish e2e diagnostics
        if: always()
        run: node e2e/support/publishDiagnostics.mjs

      # If the tests fail, keep the report and screenshots so you can see why.
      # Download them from the "Artifacts" section of the run's summary page.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
